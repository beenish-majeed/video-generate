name: CI

on:
  push:
    branches: [ main, "fix/**", "security/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-github-actions-annotate-failures pip-audit

      - name: Security audit Python dependencies
        run: |
          pip-audit -r requirements.txt

      - name: Run Pytest test suite
        env:
          API_KEY: "test_key"
        run: |
          python -m pytest tests/ -v --durations=10 --tb=short

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Security audit production npm dependencies
        run: npm audit --production --audit-level=high

      - name: Run Frontend Vitest tests
        run: npm run test:run

      - name: Build Frontend bundle
        run: npm run build
